name: Daily Editorial Collector

on:
  schedule:
    - cron: '30 2 * * 1-6' # Runs Monday to Saturday at 08:00 AM IST (02:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-editorials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 readability-lxml lxml curl_cffi

      - name: Run Multi-Source Editorial Collector
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python daily_editorial_collector.py

      - name: Commit and Push Datasets & History Ledger
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_editorials.json editorial_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Daily editorials & history ledger for $(date -u +'%Y-%m-%d')"
          git pull origin main --rebase
          git push

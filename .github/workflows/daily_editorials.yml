name: Daily Editorial Collector

on:
  schedule:
    - cron: '30 2 * * *' # Runs daily at 08:00 AM IST (02:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-editorials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 readability-lxml lxml curl_cffi

      - name: Run Multi-Source Editorial Collector
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python daily_editorial_collector.py

      - name: Commit and Push Editorial Datasets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_editorials.json today_editorials.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Multi-source daily editorials for $(date -u +'%Y-%m-%d')"
          git pull origin main --rebase
          git push

      - name: Send Telegram Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$ADMIN_CHAT_ID" ]; then
            TOTAL_COUNT=$(python -c "import json; print(json.load(open('daily_editorials.json'))['total_articles'])" 2>/dev/null || echo "all")
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "'"$ADMIN_CHAT_ID"'",
              "text": "✅ **DAILY EDITORIAL COLLECTOR COMPLETED**\n\n📰 Successfully extracted '"$TOTAL_COUNT"' curated pieces across all four thematic categories.\n💾 Updated `daily_editorials.json` & `today_editorials.json`.",
              "parse_mode": "Markdown",
              "disable_web_page_preview": true
            }'
          fi

name: Daily Editorial Collection

on:
  workflow_dispatch:
  schedule:
    # 11:00 AM IST = 05:30 UTC
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 readability-lxml curl-cffi

      - name: Collect editorials from the last 24 hours
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          python daily_editorial_collector.py

      - name: Upload daily JSON
        uses: actions/upload-artifact@v4
        with:
          name: daily-editorials-${{ github.run_number }}
          path: additional_editorials.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add additional_editorials.json
          git diff --cached --quiet || git commit -m "Update daily editorials"
          git push

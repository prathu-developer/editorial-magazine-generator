name: Generate Daily Editorial Magazine

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Editorial Schema Pipeline"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Chromium Binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          fi

      - name: Run Magazine Generator & Telegram Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ENABLE_GROUP_PUBLISH: "true"
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          TARGET_THREAD_ID: ${{ secrets.TARGET_THREAD_ID }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          MAGAZINE_INGEST_SECRET: ${{ secrets.MAGAZINE_INGEST_SECRET }}
        run: |
          python src/build_magazine.py

      - name: Upload PDF as Workflow Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Editorial-${{ github.sha }}
          path: output/*.pdf
          retention-days: 2

      - name: Send Telegram Success Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "'"$ADMIN_CHAT_ID"'",
            "text": "🎉 **STEP 3/3 COMPLETED: MAGAZINE PUBLISHED!**\n\n📚 Daily Editorial Magazine PDF generated, archived, and saved.\n\n🏁 Complete automated pipeline finished successfully.",
            "parse_mode": "Markdown",
            "disable_web_page_preview": true
          }'
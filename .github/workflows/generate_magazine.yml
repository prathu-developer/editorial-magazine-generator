name: Generate Daily Editorial Magazine

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Editorial Schema Pipeline"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ✨ SIMPLIFIED: Install dependencies and browser unconditionally
      - name: Install Python dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Magazine Generator & Telegram Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ENABLE_GROUP_PUBLISH: "true"
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          python src/build_magazine.py

      - name: Upload PDF as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Editorial-${{ github.sha }}
          path: output/*.pdf
          retention-days: 14

      - name: Send Telegram Success Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "'"$ADMIN_CHAT_ID"'",
            "text": "🎉 **STEP 3/3 COMPLETED: MAGAZINE PUBLISHED!**\n\n📚 Daily Editorial Magazine PDF generated, archived, and saved.\n\n🏁 Complete automated pipeline finished successfully.",
            "parse_mode": "Markdown",
            "disable_web_page_preview": true
          }'
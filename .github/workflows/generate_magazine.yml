name: Generate Daily Editorial Magazine

on:
  schedule:
    # Runs automatically every day at 01:00 UTC (06:30 AM IST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub

permissions:
  contents: write # Grants permission to save/commit the generated PDF to the repository

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Headless Chromium & system libraries
        run: |
          playwright install --with-deps chromium

      - name: Run Magazine Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/build_magazine.py

      - name: Upload PDF as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Editorial-${{ github.sha }}
          path: output/*.pdf
          retention-days: 14

      - name: Commit and Save PDF to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-generated daily edition: $(date +'%d-%b-%Y')" || echo "No changes to commit"
          git push origin main

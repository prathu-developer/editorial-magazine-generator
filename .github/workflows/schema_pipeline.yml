name: Daily Editorial Schema Pipeline

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Editorial Scraper"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-schema:
    runs-on: ubuntu-latest
    # Only run if triggered manually OR if the previous workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run Schema Generator
        env:
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python generate_schema.py

      - name: Save schema.json back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add schema.json schema_audit_log.md backups/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update schema.json with processed editorials and rolling backups"
          git pull origin main --rebase
          git push

      # Step 2 Telegram Notification
      - name: Send Telegram Success Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "'"$ADMIN_CHAT_ID"'",
            "text": "✅ **STEP 2/3 COMPLETED: SCHEMA GENERATED**\n\n🎯 All editorials processed through prompt schema and pushed.\n\n🔗 [View schema.json](https://github.com/prathu-developer/editorial-magazine-generator/blob/main/schema.json)\n\n⚡ Triggering Step 3 (Magazine Generator) automatically...",
            "parse_mode": "Markdown",
            "disable_web_page_preview": true
          }'
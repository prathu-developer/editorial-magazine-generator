name: Daily Editorial Scraper

on:
  schedule:
    # Runs at 01:30 UTC every day (07:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-editorials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 readability-lxml lxml curl_cffi
          
      - name: Run Editorial Scraper
        run: python scraper.py

      - name: Save today_editorials.json to Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add today_editorials.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Scraped today's 4 editorials"
          git pull origin main --rebase
          git push
name: Daily Editorial Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-editorials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 readability-lxml lxml curl_cffi

      - name: Run Editorial Scraper
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python scraper.py

      - name: Save today_editorials.json to Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add today_editorials.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Scraped today's 4 editorials"
          git pull origin main --rebase
          git push

      # Step 1 Telegram Notification
      - name: Send Telegram Success Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "'"$ADMIN_CHAT_ID"'",
            "text": "✅ **STEP 1/3 COMPLETED: EDITORIALS SCRAPED**\n\n📰 Successfully scraped today’s 4 editorials and committed `today_editorials.json`.\n\n⚡ Triggering Step 2 (Schema Pipeline) automatically...",
            "parse_mode": "Markdown",
            "disable_web_page_preview": true
          }'
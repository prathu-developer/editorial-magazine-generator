name: Daily Editorial Scraper

on:
  schedule:
    # Runs at 01:30 UTC every day (07:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows you to trigger the script manually from the GitHub UI

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 readability-lxml cloudscraper

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push generated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add today_editorials.json
          
          # Only commit if there are changes (avoids action failing if no new articles were found)
          git diff --quiet && git diff --staged --quiet || git commit -m "📝 Auto-update: Scraped today's editorials"
          git push

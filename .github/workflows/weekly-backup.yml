name: Weekly Backup Aggregator

on:
  schedule:
    # Runs at 23:00 UTC every Sunday (0 = Sunday in cron)
    - cron: '0 23 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  aggregate-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile current week data
        run: python scripts/compile_weekly_backup.py

      - name: Commit and push weekly backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_backups/
          
          # Only commit and push if new files were created or modified
          if ! git diff --cached --quiet; then
            git commit -m "Add weekly consolidated backup [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "No changes to commit."
          fi

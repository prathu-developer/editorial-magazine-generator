name: Weekly Magazine Generator

on:
  schedule:
    # Runs at 07:30 UTC every Saturday (1:00 PM IST)
    - cron: '30 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-magazine:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.46.0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 playwright requests pypdf wordfreq

      - name: Install Headless Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install OS Dependencies on Cache Hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Generate Weekly PDF & Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/build_weekly_magazine.py

      - name: Commit and Push PDF to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.pdf output/*.json
          git commit -m "Auto-generate Weekly Compilation Magazine and Audit [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weekly_Compilation_Magazine
          path: |
            output/*.pdf
            output/*.json

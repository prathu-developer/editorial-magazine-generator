name: Weekly Magazine Generator

on:
  schedule:
    # Runs at 07:30 UTC every Saturday (1:00 PM IST)
    - cron: '30 7 * * 6'
  workflow_dispatch:

jobs:
  build-magazine:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install jinja2 playwright
          playwright install chromium --with-deps

      - name: Generate Weekly PDF
        run: python src/build_weekly_magazine.py

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weekly_Compilation_Magazine
          path: output/*.pdf

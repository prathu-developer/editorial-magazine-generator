name: Weekly Magazine Generator

on:
  schedule:
    # Runs at 07:30 UTC every Saturday (1:00 PM IST)
    - cron: '30 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-magazine:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 playwright requests pypdf wordfreq

      - name: Install Headless Chromium
        run: playwright install --with-deps chromium

      - name: Generate Weekly PDF & Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/build_weekly_magazine.py

      - name: Commit and Push Audit Log to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.json
          git commit -m "Update weekly vocabulary audit log [skip ci]" || echo "No changes to commit"
          git push
